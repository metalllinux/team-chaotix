# Self-scan: secret scanning for this repository
# Ensures the agentic team configuration itself contains no secrets
name: Secret Scan Self

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - '.opencode/**'
      - 'planning/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0' # Weekly, Sunday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Call the reusable secret scan workflow
  scan-self:
    uses: ./.github/workflows/secret-scan.yml
    with:
      scan-path: '.'
