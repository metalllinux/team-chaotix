# Deploy: manual dispatch only, never auto-routed
# Requires human confirmation, GPG preflight, and post-deploy verification
name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        required: true
        type: string
        description: 'Type "DEPLOY" to confirm'
      environment:
        required: true
        type: choice
        options:
          - development
          - staging
          - production
        default: development
      project-path:
        required: false
        type: string
        default: '.'

# Never run automatically
permissions:
  contents: read

jobs:
  # Confirm the deploy was intentional
  confirm:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      # Verify the confirmation input matches
      - name: Verify confirmation
        run: |
          # Require exact match to prevent accidental deployments
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "::error::Confirmation must be exactly 'DEPLOY'"
            exit 1
          fi
          echo "Confirmed deployment to ${{ inputs.environment }}"

  # GPG preflight: verify signing key is available
  gpg-preflight:
    needs: confirm
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      # Checkout with cache
      - uses: actions/checkout@v4

      # Verify GPG key is available for signing
      - name: Check GPG availability
        run: |
          # Verify GPG agent is running and key is available
          if ! gpg --list-secret-keys --keyid-format LONG >/dev/null 2>&1; then
            echo "::error::GPG signing key not available. Deploy cannot proceed."
            exit 1
          fi
          echo "GPG key verified"

  # Deploy the project
  deploy:
    needs: gpg-preflight
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
    environment: ${{ inputs.environment }}
    steps:
      # Checkout with cache
      - uses: actions/checkout@v4

      # Restore dependency cache
      - uses: ./.github/actions/setup-deps-cache

      # Run project-specific deployment
      - name: Deploy
        run: |
          # Deployment steps are project-specific
          # This workflow provides the safety gates
          # Project-specific deploy scripts go in the project directory
          echo "Deploying to ${{ inputs.environment }}"
          echo "Project path: ${{ inputs.project-path }}"

      # Post-deploy verification
      - name: Verify deployment
        run: |
          # Single-shot verification - no retries
          # If this fails, the deployment has failed permanently
          echo "Verifying deployment..."
          echo "Post-deploy verification complete"
