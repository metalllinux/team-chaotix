# Secret scanning: reusable workflow for credential detection
# Uses gitleaks with a positive control canary to verify the scanner works
name: Secret Scan

on:
  workflow_call:
    inputs:
      scan-path:
        required: false
        type: string
        default: '.'

# No permissions needed for secret scanning
permissions:
  contents: read

jobs:
  # Detect hardcoded secrets using gitleaks
  gitleaks:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      # Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run gitleaks with positive control canary
      - uses: ./.github/actions/gitleaks-action
        with:
          path: ${{ inputs.scan-path }}

  # Deep scan using trufflehog for additional coverage
  trufflehog:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    steps:
      # Checkout repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run trufflehog filesystem scan
      - uses: ./.github/actions/security-audit
        with:
          scan-type: trufflehog
          path: ${{ inputs.scan-path }}
